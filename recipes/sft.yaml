# Supervised Fine-Tuning (SFT) Recipe with ChatML Response Masking
model: checkpoints/pretrain/model
data: data/sft/train.jsonl
val_data: data/sft/val.jsonl
output_dir: checkpoints/sft
epochs: 2
batch_size: 2
grad_accum: 4
gradient_checkpointing: true
lr: 1.0e-4
max_length: 2048
save_steps: 100
save_total_limit: 3
resume: auto
max_mem_fraction: 0.85
system_ram_limit: 88.0
wandb: false
wandb_project: jerboa
wandb_run: exp-sft
