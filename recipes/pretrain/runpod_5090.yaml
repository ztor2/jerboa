# JerboaLM Pre-training Recipe (RunPod Single RTX 5090 32GB GDDR7 Optimized)
# Blackwell (sm_120) architecture with 1,792 GB/s bandwidth & 32GB VRAM
# Disables gradient checkpointing (~21.5 GB / 32 GB peak VRAM) to eliminate ~25% recomputation overhead

mode: rolling
source: HuggingFaceFW/fineweb-edu
subset: sample-10BT
min_score: 3

# Multilingual Interleaving (Blocked schedule: 50% English Edu, 33% Korean AI-Hub, 17% Python Code)
aihub_dir: data/raw/aihub_test
interleave_pattern: fineweb,fineweb,aihub,aihub,fineweb,code

# Compute budget: 2,500 chunks x 1,500 docs (approx 4.5B - 5.0B tokens, Chinchilla 20N Optimal)
chunks: 2500
docs_per_chunk: 1500

# RTX 5090 32GB Tuned Hyperparameters:
# Micro-batch 4, seq_len 2048, grad_accum 8 -> Global batch = 32 sequences (65,536 tokens/step)
# Matches 2x4090 DDP global step trajectory while disabling activation recomputation
batch_size: 4
grad_accum: 8
seq_len: 2048
lr: 4.0e-4
min_lr: 4.0e-5
warmup_ratio: 0.03
weight_decay: 0.1

# Fault tolerance & model architecture
# Pulls latest checkpoint from Hub on initial launch, then prioritizes local latest_state.json
resume: ztor2/jerboa-base
enable_mtp: true
gradient_checkpointing: false
compile: true
save_total_limit: 2

# Guardrails
system_ram_limit: 90.0

# Experiment tracking (WandB Real-time Dashboard Enabled)
wandb: true
wandb_project: jerboa
wandb_run: jerboa-runpod-1x5090
