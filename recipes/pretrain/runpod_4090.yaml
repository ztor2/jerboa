# JerboaLM Pre-training Recipe (RunPod Single RTX 4090 24GB Optimized)
# Maximizes Ada Lovelace Tensor Core MFU (Model FLOPs Utilization) & throughput
# Target: 55,000 ~ 65,000 tok/s at ~40% VRAM load with zero OOM risk

mode: rolling
source: HuggingFaceFW/fineweb-edu
subset: sample-10BT
min_score: 3

# Multilingual Interleaving (Blocked schedule: 50% English, 35% Korean, 15% Code)
aihub_dir: data/raw/aihub_test
interleave_pattern: fineweb,fineweb,aihub,aihub,fineweb,code

# Compute budget: 1,000 chunks x 1,500 docs (approx 2.5B tokens)
chunks: 1000
docs_per_chunk: 1500

# RTX 4090 Tuned Hyperparameters:
# Micro-batch 8 feeds full GEMM tiles to 128 SMs.
# Grad accum 4 -> Global batch 32 (65,536 tokens/step - industry standard SLM scale).
# VRAM footprint: ~9.5 GB / 24 GB (14.5 GB safety buffer).
batch_size: 8
grad_accum: 4
seq_len: 2048
lr: 4.0e-4
min_lr: 4.0e-5
warmup_ratio: 0.03
weight_decay: 0.1

# Fault tolerance & model architecture
resume: auto
enable_mtp: true

# Guardrails
system_ram_limit: 90.0

# Experiment tracking
wandb: true
wandb_project: jerboa
wandb_run: jerboa-runpod-4090-phase1
