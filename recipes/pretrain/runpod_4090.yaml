# JerboaLM Pre-training Recipe (RunPod Single RTX 4090 24GB Optimized)
# Maximizes Ada Lovelace Tensor Core MFU (Model FLOPs Utilization) & throughput
# Target: 55,000 ~ 65,000 tok/s at ~40% VRAM load with zero OOM risk

mode: rolling
source: HuggingFaceFW/fineweb-edu
subset: sample-10BT
min_score: 3

# Multilingual Interleaving (Blocked schedule: 50% English, 35% Korean, 15% Code)
aihub_dir: data/raw/aihub_test
interleave_pattern: fineweb,fineweb,aihub,aihub,fineweb,code

# Compute budget: 2,500 chunks x 1,500 docs (approx 4.5B - 5.0B tokens, Chinchilla 20N Optimal)
chunks: 2500
docs_per_chunk: 1500

# RTX 4090 24GB Tuned Hyperparameters (221M Model):
# Micro-batch 4, seq_len 2048, grad_accum 8 -> Global batch 32 (65,536 tokens/step).
# VRAM footprint with gradient_checkpointing: ~12.1 GB / 24 GB.
batch_size: 4
grad_accum: 8
seq_len: 2048
lr: 4.0e-4
min_lr: 4.0e-5
warmup_ratio: 0.03
weight_decay: 0.1

# Fault tolerance & model architecture
resume: ztor2/jerboa-base
enable_mtp: true
gradient_checkpointing: true
compile: true
save_total_limit: 2

# Guardrails
system_ram_limit: 90.0

# Experiment tracking
wandb: true
wandb_project: jerboa
wandb_run: jerboa-runpod-4090-phase1
