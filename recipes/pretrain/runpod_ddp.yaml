# JerboaLM Pre-training Recipe (RunPod 2x RTX 3090 DDP, 24GB VRAM/GPU)
# Distributed multi-GPU pre-training for 221M Deep & Thin architecture

mode: rolling
source: HuggingFaceFW/fineweb-edu
subset: sample-10BT
min_score: 3

# Multilingual Interleaving (Alternating chunk schedule)
aihub_dir: data/raw/aihub_test
interleave_pattern: fineweb,aihub

# Compute budget: 1,000 chunks x 1,000 docs (approx 1.5B ~ 2.0B tokens)
chunks: 1000
docs_per_chunk: 1000

# RunPod 2x 3090 DDP hyperparameters:
# Micro-batch 8 per GPU, seq_len 2048, grad_accum 2 -> Global batch = 8 * 2 GPUs * 2 accum = 32 (65,536 tokens/step)
batch_size: 8
grad_accum: 2
seq_len: 2048
lr: 4.0e-4
min_lr: 4.0e-5
warmup_ratio: 0.03
weight_decay: 0.1

# Fresh pre-training run or auto resume
resume: auto
enable_mtp: true

# RunPod Linux resource limits
max_mem_fraction: 0.85
system_ram_limit: 90.0

# Experiment tracking
wandb: true
wandb_project: jerboa
wandb_run: jerboa-runpod-2x3090-ddp
