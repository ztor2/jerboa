# Supervised Fine-Tuning (SFT) Recipe for RunPod 1x RTX 5090 (32GB GDDR7 VRAM, BF16)
model: checkpoints/pretrain/model
data: data/sft/train.jsonl
val_data: data/sft/val.jsonl
output_dir: checkpoints/sft
epochs: 2
batch_size: 8
grad_accum: 1
gradient_checkpointing: false
lr: 1.0e-4
max_length: 2048
save_steps: 250
save_total_limit: 3
resume: auto
max_mem_fraction: 0.90
system_ram_limit: 90.0
wandb: true
wandb_project: jerboa
wandb_run: jerboa-221m-sft-5090
